
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'food_delivery'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'food_delivery'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Data-quality test severity, per target:
#   - CI and local demo (clean fixtures): error — a failing test blocks the loop.
#   - dev / prod (real data): warn — surface known issues without breaking the pipeline.
data_tests:
  +severity: "{{ 'error' if target.name in ['ci', 'demo'] else 'warn' }}"

# Deliberately failing analyst PR scenarios are part of the local DuckDB demo
# only. They are excluded from established Databricks dev/CI targets.
models:
  food_delivery:
    analyst_pr:
      +enabled: "{{ target.name == 'demo' }}"
