name: Analyst PR DuckDB Check

on:
  pull_request:
    paths:
      - '.github/workflows/analyst_pr_ci.yml'
      - 'dbt/food_delivery/models/analyst_pr/**'
      - 'dbt/food_delivery/dbt_project.yml'
      - 'dbt/food_delivery/models/sources.yml'
      - 'dbt/food_delivery/profiles.yml'
      - 'dbt/food_delivery/packages.yml'
      - 'dbt/food_delivery/package-lock.yml'
      - 'demo/**'

permissions:
  contents: read

concurrency:
  group: analyst-pr-duckdb-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyst-pr-duckdb:
    name: analyst-pr-duckdb
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt/food_delivery
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/food_delivery
      ANALYST_MODEL: fct_vendor_daily_performance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install local dbt adapter
        run: pip install dbt-duckdb==1.10.1

      - name: Install dbt packages
        run: dbt deps

      - name: Build deterministic DuckDB source layer
        run: python ../../demo/load_demo_data.py

      - name: Build analyst model and dependencies
        run: dbt run --target demo --select +$ANALYST_MODEL

      - name: Enforce analyst model contract
        run: dbt test --target demo --select $ANALYST_MODEL
