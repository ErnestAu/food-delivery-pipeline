name: dbt CI

on:
  pull_request:

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check on main, so it always runs and reports; without dbt changes the
  # build steps are skipped instead (a `paths:` filter would leave the check pending).
  dbt-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt/food_delivery
    env:
      DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/food_delivery
      # One schema per pull request: parallel PRs used to collide in a shared gold_dbt_ci.
      DBT_CI_SCHEMA: gold_dbt_ci_pr${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for dbt changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(dbt/|\.github/workflows/dbt_ci\.yml$)'; then
            echo "dbt=true" >> "$GITHUB_OUTPUT"
          else
            echo "dbt=false" >> "$GITHUB_OUTPUT"
            echo "No dbt changes in this PR; skipping the build."
          fi

      - uses: actions/setup-python@v6
        if: steps.changes.outputs.dbt == 'true'
        with:
          python-version: '3.11'

      - name: Install dbt
        if: steps.changes.outputs.dbt == 'true'
        run: pip install dbt-databricks==1.12.1

      - name: Install dbt packages
        if: steps.changes.outputs.dbt == 'true'
        run: dbt deps

      - name: Seed fixture
        if: steps.changes.outputs.dbt == 'true'
        run: dbt seed --target ci --full-refresh --threads 1

      - name: Build models
        if: steps.changes.outputs.dbt == 'true'
        run: dbt run --target ci --exclude fct_order_items

      - name: Run tests
        if: steps.changes.outputs.dbt == 'true'
        run: dbt test --target ci

      - name: Drop this run's CI schema
        if: always() && steps.changes.outputs.dbt == 'true'
        run: dbt run-operation drop_ci_schema --target ci
